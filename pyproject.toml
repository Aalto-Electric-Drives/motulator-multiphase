[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motulator-multiphase"
version = "0.1.0"
dependencies = [
    "motulator>=0.14.1",
    "numpy",
    "matplotlib",
]
requires-python = ">=3.12"
authors = [
    {name = "Marko Hinkkanen", email = "marko.hinkkanen@aalto.fi"}
]
description = "Multi-three-phase machine drives for motulator"
readme = "README.md"
license = "MIT"
keywords = [
    "control",
    "converter",
    "dual-three-phase",
    "electric",
    "machine",
    "motor",
    "multiphase",
    "simulation",
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/mhinkkan/motulator-multiphase"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "PL", "UP"]
ignore = ["PLR2004"]  # Ignore magic value warnings
pylint = {max-args = 14}
flake8-bugbear = {extend-immutable-calls = ["math.sqrt"]}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests", "motulator_multiphase"]
addopts = "--doctest-modules"

[tool.pyright]
include = ["motulator_multiphase", "tests", "examples"]
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
]
typeCheckingMode = "standard"
